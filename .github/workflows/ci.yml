# CI/CD do frontend (Agendly-app-web)
#   verificar  -> npm ci, TypeScript, testes unitários (vitest) e build de produção
#   lint       -> ESLint + Prettier (bloqueia; avisos não bloqueiam)
#   auditoria  -> npm audit (dependências com vulnerabilidade alta ou crítica)
#   imagem     -> build da imagem Docker; em push na main publica no GHCR
# E2E (Cypress) precisa da API no ar: roda local com `npm run test:e2e` (ver docs/ci-cd-e-variaveis.md).
name: CI frontend

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Mesmo valor da imagem e do lab: front e API no mesmo domínio (Nginx).
  VITE_API_BASE_URL: /api/v1
  CYPRESS_INSTALL_BINARY: "0" # o binário do Cypress não é usado nestes jobs

jobs:
  verificar:
    name: Tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Testes unitários
        run: npx vitest run
      - name: Build de produção
        run: npx vite build

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx eslint .

  auditoria:
    name: Auditoria de dependências
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm audit --omit=dev --audit-level=high

  imagem:
    name: Imagem Docker
    runs-on: ubuntu-latest
    needs: verificar
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login no GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: VITE_API_BASE_URL=${{ env.VITE_API_BASE_URL }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          load: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test da imagem
        if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        run: |
          docker run -d --name front -p 3000:3000 "$(echo '${{ steps.meta.outputs.tags }}' | head -n1)"
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3000/login >/dev/null && echo "front respondeu" && exit 0
            sleep 2
          done
          docker logs front; exit 1
