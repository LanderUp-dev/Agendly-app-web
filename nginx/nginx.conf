# Proxy reverso do lab: front e API no mesmo domínio (sem CORS).
# Montado em /etc/nginx/conf.d/default.conf.

# RS-08: primeira barreira contra força bruta (a API também limita por IP e por e-mail).
# 10 req/min por IP nas rotas de login, cadastro e recuperação de senha; rajada de 5.
limit_req_zone $binary_remote_addr zone=autenticacao:10m rate=10r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;

    client_max_body_size 2m;
    server_tokens off;

    # Headers de segurança (o "always" mantém nas respostas de erro também).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # RS-09 / S7: CSP. O token fica no localStorage; se um dia entrar um XSS, a CSP impede
    # carregar script de outro domínio e mandar dados para fora (connect/img/form só para o
    # próprio site). 'unsafe-inline' em script é necessário pelos scripts de hidratação que o
    # TanStack Start coloca no HTML (próximo passo: nonce). Fontes: Google Fonts.
    # Mudou algo no front que carrega recurso externo? Ajuste aqui e teste (docs/producao.md).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    # HSTS só faz sentido com HTTPS; em produção o Nginx (ou o provedor) termina o TLS e liga:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # (ver docs/producao.md, seção HTTPS)

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    # Sobrescreve (não acrescenta): o cliente não consegue forjar o IP visto pela API.
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    # O backend está em outro compose: resolve o nome a cada requisição (DNS do Docker),
    # assim o Nginx sobe mesmo se a API ainda não estiver no ar (responde 502 até ela subir).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://backend:8080;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Rotas públicas sensíveis: limite por IP antes de chegar à API.
    location ~ ^/api/v1/(auth/login|auth/user/|usuarios$) {
        limit_req zone=autenticacao burst=5 nodelay;
        proxy_pass $api_upstream;
        proxy_read_timeout 60s;
    }

    # API: proxy_pass sem caminho mantém a URI original (/api/v1/...)
    location /api/ {
        proxy_pass $api_upstream;
        proxy_read_timeout 60s;
    }

    # Front (servidor Node do TanStack Start)
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
    }
}
