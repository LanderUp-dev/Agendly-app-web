# Proxy reverso do lab: front e API no mesmo domínio (sem CORS).
# Montado em /etc/nginx/conf.d/default.conf.

server {
    listen 80;
    server_name _;

    client_max_body_size 2m;
    server_tokens off;

    # Headers de segurança (o "always" mantém nas respostas de erro também).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # HSTS só faz sentido com HTTPS; habilitar quando houver TLS:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    # O backend está em outro compose: resolve o nome a cada requisição (DNS do Docker),
    # assim o Nginx sobe mesmo se a API ainda não estiver no ar (responde 502 até ela subir).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://backend:8080;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # API: proxy_pass sem caminho mantém a URI original (/api/v1/...)
    location /api/ {
        proxy_pass $api_upstream;
        proxy_read_timeout 60s;
    }

    # Front (servidor Node do TanStack Start)
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
    }
}
